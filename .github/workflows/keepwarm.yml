name: keep warm

on:
  schedule:
    - cron: "*/20 21-23,0-8 * * 0-5"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the app
        run: |
          echo "Pinging $URL"
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "$URL")
          echo "Returned $code"
        env:
          URL: https://research-app-5tuzhcytnsdtwprio6mcwj.streamlit.app/